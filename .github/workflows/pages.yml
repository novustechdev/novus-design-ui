name: Deploy reference site to GitHub Pages

on:
  push:
    branches: [main, 001-novus-design-kit]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build admin kit demos
        run: |
          (cd admin-kits/tailwind && npm ci --no-audit --no-fund && npx vite build)
          (cd admin-kits/material && npm ci --no-audit --no-fund && npx vite build)
          (cd admin-kits/blazor-demo && npm ci --no-audit --no-fund && dotnet publish -c Release -v q)
      - name: Build reference site
        run: node site/build.mjs
      - name: Run quality gates
        run: scripts/gates.sh
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
