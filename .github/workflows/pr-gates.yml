name: PR gates

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build admin kit demos
        run: |
          (cd admin-kits/tailwind && npm ci --no-audit --no-fund && npx vite build)
          (cd admin-kits/material && npm ci --no-audit --no-fund && npx vite build)
          (cd admin-kits/blazor-demo && npm ci --no-audit --no-fund && dotnet publish -c Release -v q)
      - name: Build reference site
        run: node site/build.mjs
      - name: Run quality gates
        run: scripts/gates.sh
