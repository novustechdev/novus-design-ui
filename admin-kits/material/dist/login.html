<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="./favicon.png">
<title>Sign in · Novus Admin Kit</title>
<script>
try { var t = localStorage.getItem("novus-theme");
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
} catch (e) {}
</script>
  <script type="module" crossorigin src="./assets/app-DkCGKXKm.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/app-B0-9YTtN.css">
</head>
<body>
<div class="demobar">Built with the Novus Design Kit · <a href="https://ui-kit.novustech.dev/admin-kit.html">back to the docs</a></div>
<main class="loginwrap">
  <form class="card logincard" id="loginform">
    <span class="brandmark" role="img" aria-label="Novus Technologies"></span>
    <h2 style="text-align:center">novapay operations · admin</h2>
    <p class="muted" style="text-align:center">Sample login. Demo credentials: admin / admin. Nothing is stored.</p>
    <div class="alert alert--danger" id="loginerror" hidden>Wrong username or password. Use admin / admin.</div>
    <md-outlined-text-field id="l-user" label="Username" autocomplete="username" style="width:100%;margin-bottom:var(--space-4)"></md-outlined-text-field>
    <md-outlined-text-field id="l-pass" label="Password" type="password" autocomplete="current-password" style="width:100%;margin-bottom:var(--space-4)"></md-outlined-text-field>
    <md-filled-button type="submit" style="width:100%">Sign in</md-filled-button>
  </form>
</main>
</body>
</html>
