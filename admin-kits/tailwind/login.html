<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Novus Admin Kit</title>
<script>
try { var t = localStorage.getItem("novus-theme");
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
} catch (e) {}
</script>
</head>
<body>
<div class="demobar">Built with the Novus Design Kit · <a href="https://ui-kit.novustech.dev/admin-kit.html">back to the docs</a></div>
<main class="loginwrap">
  <form class="card logincard" id="loginform">
    <span class="brandmark" role="img" aria-label="Novus Technologies"></span>
    <h2 style="text-align:center">novapay operations · admin</h2>
    <p class="muted" style="text-align:center">Sample login. Demo credentials: admin / admin. Nothing is stored.</p>
    <div class="alert alert--danger" id="loginerror" hidden>Wrong username or password. Use admin / admin.</div>
    <div class="field"><label for="l-user">Username</label><input class="input" id="l-user" autocomplete="username"></div>
    <div class="field"><label for="l-pass">Password</label><input class="input" id="l-pass" type="password" autocomplete="current-password"></div>
    <button class="btn btn--primary" style="width:100%">Sign in</button>
  </form>
</main>
<script type="module" src="/src/app.js"></script>
</body>
</html>
