<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regression: visually hidden text inside a scrolling table</title>
<!-- Served from the repository root by the audit's --target fallback, so this
     exercises the real shipped stylesheets, not a copy. -->
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/console.css">
</head>
<body>
<!-- Feature 011, User Story 1. A .sr-only span inside .tablewrap is absolutely
     positioned. If .tablewrap is not a containing block, the span resolves
     against the initial containing block, escapes the wrap's clip, and extends
     the document's scroll width: the page scrolls sideways at 375px while the
     table itself looks correctly contained. Gate 11 must catch that. -->
<main class="adminmain">
  <div class="card card--flush">
    <div class="tablewrap">
      <table class="table">
        <thead>
          <tr><th>Payout reference</th><th>Created</th><th>Merchant</th><th>Amount (USD)</th><th>Status</th><th>Actions</th></tr>
        </thead>
        <tbody>
          <tr>
            <td>PO-2024-00817342</td><td>2026-09-22 18:31</td><td>Northwind Trading</td>
            <td class="num">18,240.55</td>
            <td><span class="badge badge--success"><span class="badge__dot"></span>Completed</span></td>
            <td class="cell--actions"><a class="btn btn--secondary btn--sm toggle44" href="#">View<span class="sr-only"> payout PO-2024-00817342</span></a></td>
          </tr>
          <tr>
            <td>PO-2024-00817341</td><td>2026-09-22 17:04</td><td>Contoso Retail Group</td>
            <td class="num">2,915.00</td>
            <td><span class="badge badge--danger"><span class="badge__dot"></span>Returned</span></td>
            <td class="cell--actions"><a class="btn btn--secondary btn--sm toggle44" href="#">View<span class="sr-only"> payout PO-2024-00817341</span></a></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
</body>
</html>
