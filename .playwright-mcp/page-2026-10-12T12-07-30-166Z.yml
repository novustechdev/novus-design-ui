        - heading "Usage" [level=2] [ref=f9e186]
        - list [ref=f9e187]:
          - listitem [ref=f9e188]: ›Search takes the remaining width; the Filters trigger sits at the end of the same row and shows how many filters are on.
          - listitem [ref=f9e189]: "›The sheet has two panes: categories on one side (native radio tabs), the chosen category's options on the other (checkboxes). Choosing a category never closes the sheet; long option lists scroll inside their pane; six categories at most. On phones the categories sit above the options."
          - listitem [ref=f9e190]: ›Every ticked option appears as a removable chip naming its category and value, followed by Clear all. Options within a category combine with OR; categories combine with AND.
          - listitem [ref=f9e191]: ›Quick chips with live counts sit above queue-style lists for the one dimension people switch most (status, bucket); exactly one is selected. Keep that dimension out of the sheet so the two controls never disagree.
          - listitem [ref=f9e192]: "›Only a few filters? Use the compact row: plain controls on one line that scrolls sideways instead of wrapping. A dropdown there is a trigger, not a text field — it keeps the Filters button's height, radius and inset padding, and the row's inline padding keeps the first and last control off the edge it scrolls against."
          - listitem [ref=f9e193]: ›Everything opens and closes with JavaScript off (native details, radios, checkboxes); applying the filters is the application's job, and an empty result offers to clear them.
