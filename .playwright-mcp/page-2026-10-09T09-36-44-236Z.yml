        - heading "Popovers and menus in a table" [level=3] [ref=f4e194]
        - paragraph [ref=f4e195]: "The scroll wrap is a containing block, so anything absolutely positioned inside it is clipped by it. That is deliberate: it keeps visually hidden text from extending the page sideways on a phone. It also means a row menu, popover or tooltip must render outside the wrap rather than inside the cell it belongs to."
        - heading "CSS" [level=2] [ref=f4e196]
        - paragraph [ref=f4e197]:
          - text: These rules ship in the console pattern layer,
          - code [ref=f4e198]: admin-kits/shared/novus-admin.css
          - text: ", which this site and every Admin Kit flavor load after"
          - code [ref=f4e199]: tokens.css
          - text: . Copy the whole layer, or only the sections below; every value is a token.
        - figure [ref=f4e200]:
          - generic [ref=f4e201]:
            - generic [ref=f4e202]: "@pattern content-fit"
            - button "Copy" [ref=f4e203] [cursor=pointer]
          - code [ref=f4e205]: "/* One short value, one line. Tables scroll inside .tablewrap instead of squeezing; free text opts back into wrapping; fixed slots truncate. */ .badge, .filterchip, .quickchip, .crumbs li, .paginator__label, .listfooter__range, .nowrap { white-space: nowrap; } .truncate { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } /* Positioned so the wrap is the containing block for its own absolutely positioned descendants. Without this, a .sr-only span inside a horizontally scrolled table resolves against the initial containing block, escapes this clip, and extends the document's scroll width: the page scrolls sideways on a phone while the table looks correctly contained. A popover inside a scrolling table must therefore be rendered outside the wrap, because it is now clipped by it. */ .tablewrap { position: relative; overflow-x: auto; overscroll-behavior-x: contain; } .tablewrap table th, .tablewrap table td { white-space: nowrap; vertical-align: middle; } .tablewrap table .cell--wrap { white-space: normal; min-width: 16rem; } .table th.num, .table td.num { text-align: right; font-variant-numeric: tabular-nums; } .table th.cell--actions, .table td.cell--actions { text-align: right; width: 1%; } .cell--actions .btn + .btn { margin-inline-start: var(--space-2); } .cell-stack { display: flex; flex-direction: column; gap: calc(var(--space-1) / 2); } .cell-stack__meta { font-size: var(--text-xs); line-height: var(--lh-xs); color: var(--text-secondary); } /* Portal text uses the width of its row: the kit's reading measure is for prose, so console screens reset it. A measure is opted into explicitly (constitution 1.12.0, Principle IV). */ .adminmain p, .adminmain li, .authcard p, .settings p, .signedout p, .chartcard p { max-width: none; } .measure { max-width: 68ch; }"
