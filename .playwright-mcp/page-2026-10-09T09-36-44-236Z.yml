        - heading "Usage" [level=2] [ref=f4e181]
        - list [ref=f4e182]:
          - listitem [ref=f4e183]:
            - text: ›Put every data table in a
            - code [ref=f4e184]: .tablewrap
            - text: ": cells stay on one line and the table scrolls sideways inside its container instead of squeezing columns, so identifiers, names, chips, dates, and amounts never break across lines. The page itself never scrolls sideways."
          - listitem [ref=f4e185]:
            - text: ›Free-text columns opt back into wrapping with
            - code [ref=f4e186]: .cell--wrap
            - text: ", which keeps a readable minimum width."
          - listitem [ref=f4e187]:
            - text: ›A second fact in a cell goes in a
            - code [ref=f4e188]: .cell-stack
            - text: ": two single-line lines, the second one muted."
          - listitem [ref=f4e189]:
            - text: ›Numeric columns take
            - code [ref=f4e190]: class="num"
            - text: on the header and the cells (right-aligned, tabular numerals); row actions take
            - code [ref=f4e191]: .cell--actions
            - text: ", aligned to the end."
