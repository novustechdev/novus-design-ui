          - code [ref=e244]: ".adminwrap { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; } .demobar { background: var(--bg-subtle); border-bottom: 1px solid var(--border); padding: var(--space-1) var(--gutter); font-size: var(--text-xs); color: var(--text-secondary); text-align: right; } .appbar__inner { max-width: none; font-size: var(--text-sm); line-height: var(--lh-sm); } .appheader { flex-wrap: nowrap; } .appheader__left { min-width: 0; gap: var(--space-2); } .appheader__right { min-width: 0; } .appsuffix { font-size: var(--text-sm); white-space: nowrap; } .appname { font-weight: var(--weight-bold); font-size: var(--text-lg); color: var(--text); } /* A 44px target, anywhere. Named for the rule it satisfies rather than the menu toggle it was first written for. .toggle44 is the former name and keeps working, so nothing already shipped breaks. */ .target44, .toggle44 { min-height: 2.75rem; min-width: 2.75rem; } .navtoggle { padding: 0; cursor: pointer; } .navtoggle__input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; } .navtoggle__input:focus-visible ~ .appbar .navtoggle { box-shadow: var(--focus-ring); } /* Endorsement: placed asset via tokens, dark swap under BOTH triggers */ .brandmark { display: block; height: var(--logo-height); width: 132px; background: var(--logo-master-colour) center/contain no-repeat; flex: 0 0 auto; } [data-theme=\"dark\"] .brandmark { background-image: var(--logo-master-white); } @media (prefers-color-scheme: dark) { :root:not([data-theme]) .brandmark { background-image: var(--logo-master-white); } } [data-theme=\"light\"] .brandmark { background-image: var(--logo-master-colour); } .adminbody { flex: 1; width: 100%; padding: var(--space-5) var(--gutter) var(--space-8); font-size: var(--text-sm); line-height: var(--lh-sm); } .adminmain { min-width: 0; } @media (min-width: 900px) { .adminbody { display: grid; grid-template-columns: 15rem minmax(0, 1fr); gap: var(--space-6)