e below 520px: divider and suffix drop, endorsement steps down, never disappears */ @media (max-width: 519.98px) { .appsuffix, .appheader__sep { display: none; } .brandmark { height: 20px; width: 65px; } .appbar__inner, .appheader__right { gap: var(--space-2); } } /* Icon theme toggle (moon in light, sun in dark), mirrored under both triggers */ .themetoggle .ic-sun { display: none; } [data-theme=\"dark\"] .themetoggle .ic-moon { display: none; } [data-theme=\"dark\"] .themetoggle .ic-sun { display: inline-block; } @media (prefers-color-scheme: dark) { :root:not([data-theme]) .themetoggle .ic-moon { display: none; } :root:not([data-theme]) .themetoggle .ic-sun { display: inline-block; } } [data-theme=\"light\"] .themetoggle .ic-moon { display: inline-block; } [data-theme=\"light\"] .themetoggle .ic-sun { display: none; }"
