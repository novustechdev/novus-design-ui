        - heading "Usage" [level=2] [ref=e218]
        - list [ref=e219]:
          - listitem [ref=e220]: ›Top-level links for the one or two screens people use most; everything else sits in groups named for an area, set in small caps with one line icon and a chevron.
          - listitem [ref=e221]:
            - text: ›The group holding the current page is open. The current link carries the accent tint, the accent edge, and
            - code [ref=e222]: aria-current="page"
            - text: .
          - listitem [ref=e223]: "›One visually hidden checkbox drives the menu button: at desktop width it collapses the navigation to a rail of icons, and below 900px it opens the navigation as a drawer with a scrim that closes it. No JavaScript is required; the console script only closes the drawer after a link is followed and on Escape."
          - listitem [ref=e224]:
            - text: ›Collapsing never hides the navigation. The rail keeps one icon per destination at 44px, marks the current page with the accent tint, and names each destination through
            - code [ref=e225]: title
            - text: and the label text, which stays in the markup for assistive technology. Press the menu button in the example above to see it.
          - listitem [ref=e226]: ›Because of that rail, every destination carries an icon, including items inside groups. In the rail the group labels and chevrons step aside and their children show as icons, so nothing sits behind a collapsed group.
          - listitem [ref=e227]: ›Labels are one to three words and never wrap. Rows are 36px on fine pointers and 44px on touch screens.
        - heading "Choosing a sidebar" [level=2] [ref=e228]
        - list [ref=e229]:
          - listitem [ref=e230]: "›Grouped (NovaCard, the first example): when destinations belong to areas — Cards, Payments, Risk — the tree earns its keep, and the collapse control is the appbar hamburger, because the sidebar is one part of a wider header."
          - listitem [ref=e231]:
            - text: ›Flat (
            - code [ref=e232]: .adminnav--flat
            - text: ", the second example): when every destination is a peer and a group would invent a hierarchy that does not exist, the list is flat and the control is a chevron pinned to the sidebar's own edge. Collapsing hides labels only, so the button sits beside the thing it collapses instead of travelling to the other end of the window."
          - listitem [ref=e233]: "›The two are the same mechanism: one hidden checkbox, the same rail, no JavaScript. Only the button and its icon change — a hamburger for the grouped tree, a chevron that flips direction with the state."
          - listitem [ref=e234]: ›Below 900px both are drawers and the control returns to the appbar hamburger; the edge chevron is desktop-only and hides with the docked sidebar.
        - heading "CSS" [level=2] [ref=e235]
        - paragraph [ref=e236]:
          - text: These rules ship in the console pattern layer,
          - code [ref=e237]: admin-kits/shared/novus-admin.css
          - text: ", which this site and every Admin Kit flavor load after"
          - code [ref=e238]: tokens.css
          - text: . Copy the whole layer, or only the sections below; every value is a token.
